<div>
    <h2>Users</h2>

    <div>
        <label>User Name</label>
        <input type="text" placeholder="Type name to filter..." [(ngModel)]="searchTerm" (keyup.enter)="search()">
        <button type="button" (click)="search()">Search</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Options</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of filteredUsers()">
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <button [routerLink]="['/users/edit', user.id]">Edit</button>
                    <button type="button" (click)="deleteUser(user.id!)">Delete</button>
                </td>
            </tr>
            <tr *ngIf="filteredUsers().length === 0">
                <td colspan="4">No users found.</td>
            </tr>
        </tbody>
    </table>

    <div>
        <button type="button" (click)="navigateToCreate()">Create New User</button>
    </div>
</div>
